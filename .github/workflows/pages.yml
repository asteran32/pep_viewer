name: Publish PEP Viewer
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Package static viewer only
        shell: bash
        run: |
          if [ -f github_page/index.html ]; then source_dir=github_page; else source_dir=.; fi
          mkdir -p _site
          cp "$source_dir/index.html" "$source_dir/codebook.html" "$source_dir/analysis.html" "$source_dir/.nojekyll" _site/
          cp -R "$source_dir/assets" "$source_dir/src" "$source_dir/vendor" "$source_dir/data" _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
